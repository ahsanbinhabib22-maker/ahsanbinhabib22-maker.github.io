

<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AHSAN — প্রতিদিনের অনুভূতি</title>
<style>
body{background:#090909;color:#f5e8c8;font-family:Arial;text-align:center;margin:0;padding:30px 15px}
h1{color:#d9b45b;font-size:38px;letter-spacing:5px}
.card{max-width:600px;margin:40px auto;background:#171717;border:1px solid #d9b45b;border-radius:15px;padding:25px}
h2{color:#d9b45b}
p{font-size:20px;line-height:1.8}
button{background:#d9b45b;border:0;padding:12px 20px;border-radius:8px;margin:8px}
footer{color:#888;margin-top:50px}
</style>
</head>
<body>
<h1>AHSAN</h1>
<p>প্রতিদিনের অনুভূতি</p>
<div class="card">
<h2>আজকের অনুভূতি</h2>
<p id="caption">নীরবতার মাঝেও কিছু অনুভূতি থাকে, যা ভাষায় প্রকাশ করা যায় না।</p>
<button onclick="navigator.clipboard.writeText(document.getElementById('caption').innerText).then(()=>alert('কপি হয়েছে'))">কপি করুন</button>
<button onclick="navigator.share({text:document.getElementById('caption').innerText})">শেয়ার করুন</button>
</div>
<footer>© 2026 AHSAN</footer>
</body>
</html>
